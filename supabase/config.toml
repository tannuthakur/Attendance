# Supabase local development config (`supabase start`).
project_id = "employee-invoicing"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email testing (Mailpit UI at http://127.0.0.1:54324)
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# No public sign-up (§5.1): users are created by admins.
enable_signup = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 60

[auth.email]
# NOTE: in this section `enable_signup` turns the whole EMAIL PROVIDER on/off ("Email logins are disabled"
# when false). Public sign-up is disabled by `[auth] enable_signup = false` above; admins still create users.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

# Links use token_hash so they work in any browser (admin-sent invites/resets have no PKCE
# verifier in the recipient's browser); /auth/callback verifies them with verifyOtp.
[auth.email.template.invite]
subject = "You have been invited"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = false
